<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anúncios Visuais — Editor de Etiquetas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --ink:#14161D; --ink-soft:#1D2029; --panel:#20232E; --panel-soft:#2A2E3B;
    --paper:#EDEAE1; --line:#D9D4C6;
    --accent:#3457D5; --amber:#E0A63A; --ink2:#565B6B; --ink3:#8A8FA0;
    --danger:#C24545; --good:#2E8B57;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:var(--font-body);color:#fff;-webkit-font-smoothing:antialiased;}
  #app{display:flex;width:100%;height:100vh;overflow:hidden;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-soft);border-radius:8px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input,select,textarea{font-family:inherit;}
  input:disabled,select:disabled{opacity:.45;cursor:not-allowed;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  .flex{display:flex;} .flex-col{flex-direction:column;} .items-center{align-items:center;}
  .justify-between{justify-content:space-between;} .justify-center{justify-content:center;}
  .flex-1{flex:1;min-width:0;} .shrink-0{flex-shrink:0;} .gap-1{gap:4px;} .gap-1_5{gap:6px;}
  .gap-2{gap:8px;} .gap-2_5{gap:10px;} .gap-3{gap:12px;} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grid{display:grid;} .relative{position:relative;} .absolute{position:absolute;} .hidden{display:none !important;}
  .w-full{width:100%;} .overflow-y-auto{overflow-y:auto;} .overflow-auto{overflow:auto;} .overflow-hidden{overflow:hidden;}
  .cursor-pointer{cursor:pointer;} .text-center{text-align:center;} .mt-auto{margin-top:auto;}

  .navrail{width:76px;flex-shrink:0;background:var(--ink);border-right:1px solid var(--panel-soft);
    display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:4px;}
  .navrail .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .navrail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;width:64px;}
  .navrail button.active{background:var(--panel-soft);}
  .navrail button span{font-size:9.5px;color:var(--ink3);}
  .navrail button.active span{color:#fff;}
  .navrail button svg{color:var(--ink3);}
  .navrail button.active svg{color:var(--amber);}

  .icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--ink3);transition:background .12s;}
  .icon-btn:hover{background:var(--panel-soft);}
  .icon-btn.active{background:var(--accent);color:#fff;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.sm{width:22px;height:22px;}

  .main-view{flex:1;min-width:0;overflow-y:auto;padding:32px;}
  h1.page-title{font-family:var(--font-display);font-size:24px;color:#fff;font-weight:600;margin:0;}
  .page-sub{color:var(--ink3);font-size:13px;margin-top:4px;}

  .btn-primary{background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .btn-secondary{background:var(--panel);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .btn-ghost{background:var(--ink-soft);color:#fff;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .btn-danger-soft{background:#3A1E1E;color:#F0A0A0;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:600;}

  .input,select.input,textarea.input{width:100%;padding:8px 10px;border-radius:8px;font-size:13px;background:var(--ink-soft);
    border:1px solid var(--panel-soft);color:#EDEAE1;outline:none;}
  .field{display:block;margin-bottom:12px;}
  .field-label{display:block;margin-bottom:5px;font-size:11.5px;font-weight:600;color:var(--ink3);}

  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
  .stat-card{background:var(--panel);border:1px solid var(--panel-soft);border-radius:16px;padding:16px;}
  .stat-dot{width:8px;height:8px;border-radius:8px;margin-bottom:10px;}
  .stat-value{font-family:var(--font-display);font-size:26px;font-weight:600;}
  .stat-label{font-size:12px;color:var(--ink3);}

  .proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}

  .card{background:var(--panel);border:1px solid var(--panel-soft);border-radius:16px;overflow:hidden;cursor:pointer;}
  .card .thumb{aspect-ratio:16/11;background:var(--ink-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .body{padding:14px;}
  .card .title{color:#fff;font-size:13.5px;font-weight:600;}
  .card .meta{color:var(--ink3);font-size:11.5px;margin-top:4px;}
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px;background:#00000088;border-radius:8px;padding:2px;opacity:0;transition:opacity .12s;}
  .card:hover .card-actions{opacity:1;}

  .empty-state{background:var(--panel);border:1px dashed var(--panel-soft);border-radius:16px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:64px 24px;}
  .empty-state h3{font-family:var(--font-display);color:#fff;font-size:16px;margin:12px 0 6px;}
  .empty-state p{color:var(--ink3);font-size:13px;max-width:380px;margin:0;}

  .prod-card{background:var(--panel);border:1px solid var(--panel-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;}
  .prod-card .img{height:120px;border-radius:12px;background:var(--ink-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;}
  .prod-card .img img{width:100%;height:100%;object-fit:cover;}
  .prod-card .name{color:#fff;font-size:13.5px;font-weight:600;}
  .prod-card .sub{color:var(--ink3);font-size:11px;margin:2px 0 8px;}
  .prod-card .price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .price-main{color:var(--amber);font-size:15px;font-weight:700;font-family:var(--font-mono);}
  .price-old{color:var(--ink3);font-size:11px;text-decoration:line-through;}
  .status-pill{font-size:10.5px;padding:4px 9px;border-radius:99px;font-weight:600;}
  .status-pill.active{background:#1F3D2C;color:var(--good);}
  .status-pill.inactive{background:var(--ink-soft);color:var(--ink3);}

  .modal-overlay{position:fixed;inset:0;background:#0B0C10AA;display:flex;align-items:center;justify-content:center;padding:16px;z-index:200;}
  .modal-box{background:var(--panel);border:1px solid var(--panel-soft);border-radius:18px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #00000066;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--panel-soft);}
  .modal-head h3{font-family:var(--font-display);color:#fff;font-size:16px;font-weight:600;margin:0;}
  .modal-body{padding:16px 20px;overflow-y:auto;}

  .editor{flex:1;min-width:0;display:flex;}
  .scenes-panel{width:224px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--panel-soft);display:flex;flex-direction:column;}
  .scenes-head{padding:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--panel-soft);}
  .scenes-head input{background:transparent;color:#fff;font-size:13.5px;font-weight:600;border:none;outline:none;width:100%;}
  .scenes-sub{padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between;}
  .scenes-sub span{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.4px;}
  .scenes-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;}
  .scene-item{border-radius:12px;padding:8px;cursor:pointer;border:1px solid transparent;}
  .scene-item.active{background:var(--panel-soft);border-color:var(--accent);}
  .scene-thumb{height:70px;border-radius:8px;background:var(--ink-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px;}
  .scene-thumb img{width:100%;height:100%;object-fit:cover;}
  .scene-row{display:flex;align-items:center;justify-content:space-between;}
  .scene-row span{font-size:11.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scene-actions{display:flex;gap:1px;opacity:0;}
  .scene-item:hover .scene-actions{opacity:1;}

  .editor-center{flex:1;min-width:0;display:flex;flex-direction:column;}
  .editor-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--panel-soft);background:var(--ink);flex-wrap:wrap;gap:8px;}
  .editor-canvas-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:32px;
    background-color:var(--ink-soft);background-image:radial-gradient(var(--panel) 1px, transparent 1px);background-size:18px 18px;}
  .canvas-stage{position:relative;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 20px 60px #0009;user-select:none;}
  .canvas-stage img.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .upload-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;cursor:pointer;background:var(--panel);border:2px dashed var(--panel-soft);width:420px;}
  .upload-drop span{color:var(--ink3);font-size:13px;margin-top:10px;}

  .props-panel{width:288px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--panel-soft);display:flex;flex-direction:column;overflow-y:auto;}
  .props-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--panel-soft);}
  .props-head span{color:#fff;font-size:13px;font-weight:600;}
  .props-body{padding:16px;}
  .style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .style-swatch{border-radius:10px;padding:8px 0;font-size:10.5px;font-weight:600;border:1px solid var(--panel-soft);}
  .style-swatch.selected{border:2px solid var(--amber);}
  .seg-btn-row{display:flex;gap:6px;flex-wrap:wrap;}
  .seg-btn{flex:1;padding:7px 0;border-radius:8px;font-size:12px;background:var(--ink-soft);color:#fff;text-align:center;}
  .seg-btn.selected{background:var(--accent);}
  .product-mini{background:var(--ink-soft);border-radius:12px;padding:12px;display:flex;gap:10px;margin-bottom:16px;}
  .product-mini img,.product-mini .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--panel-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .quick-actions{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--panel-soft);}
  .quick-actions .btn-ghost{flex:1;justify-content:center;}

  .layers-add{padding:16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--panel-soft);}
  .layers-list{flex:1;overflow-y:auto;padding:12px;}
  .layers-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 4px;}
  .layers-title span{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.4px;}
  .layer-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;background:var(--panel-soft);cursor:pointer;margin-bottom:4px;}
  .layer-row span.label-txt{flex:1;font-size:12px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer-actions{display:flex;gap:1px;opacity:.4;}
  .layer-row:hover .layer-actions{opacity:1;}

  .cv-label{position:absolute;display:flex;align-items:center;cursor:grab;}
  .cv-label .box{white-space:nowrap;line-height:1.25;}
  .cv-point{position:absolute;width:12px;height:12px;border-radius:99px;transform:translate(-50%,-50%);cursor:grab;z-index:500;}
  .cv-resize{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:99px;background:var(--amber);border:2px solid #fff;cursor:nwse-resize;}
  .cv-text{position:absolute;cursor:grab;padding:2px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);color:#fff;padding:10px 16px;
    border-radius:99px;font-size:13px;display:flex;align-items:center;gap:8px;border:1px solid var(--panel-soft);box-shadow:0 10px 30px #0006;z-index:300;}

  .coming-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
  .coming-inner{max-width:420px;text-align:center;}
  .coming-icon{width:56px;height:56px;border-radius:16px;background:var(--panel);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .coming-inner h2{font-family:var(--font-display);color:#fff;font-size:20px;margin:0 0 8px;}
  .coming-inner p{color:var(--ink3);font-size:13.5px;line-height:1.6;margin:0;}

  .tabbar{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--ink-soft);margin-bottom:16px;}
  .tabbar button{flex:1;padding:9px 0;border-radius:9px;font-size:12.5px;font-weight:600;color:#fff;}
  .tabbar button.selected{background:var(--accent);}

  .video-scene-row{margin-bottom:6px;}

  /* ============================== RESPONSIVE / MOBILE ============================== */
  .mobile-topbar{display:none;}
  .mobile-only{display:none;}
  .drawer-close-btn{display:none;}
  .mobile-backdrop{display:none;}
  .cv-label,.cv-point,.cv-resize,.cv-text{touch-action:none;}
  .canvas-stage{touch-action:none;}

  @media (max-width:900px){
    html,body{height:100%;}
    #app{flex-direction:column;height:100dvh;position:relative;overflow:hidden;}
    .mobile-topbar{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:10px 12px;background:var(--ink);border-bottom:1px solid var(--panel-soft);flex-shrink:0;z-index:60;
    }
    .mobile-topbar-title{color:#fff;font-family:var(--font-display);font-size:14.5px;font-weight:600;flex:1;text-align:center;}
    .mobile-only{display:flex;}
    .desktop-only{display:none !important;}
    .drawer-close-btn{display:flex;}
    .mobile-backdrop{display:block;position:fixed;inset:0;background:#000000AA;z-index:140;}

    .navrail{
      position:fixed;top:0;left:0;bottom:0;width:220px;flex-direction:column;align-items:stretch;
      padding:16px 10px;transform:translateX(-100%);transition:transform .22s ease;z-index:150;
      box-shadow:8px 0 30px #0008;
    }
    .navrail.open{transform:translateX(0);}
    .navrail button{flex-direction:row;justify-content:flex-start;gap:10px;width:100%;padding:11px 10px;}
    .navrail button span{font-size:13px;}
    .navrail .logo{align-self:flex-start;margin-left:4px;}

    .main-view-wrap{flex:1;min-height:0;overflow:hidden;}
    .main-view{padding:16px;height:100%;}
    .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .proj-grid{grid-template-columns:1fr;gap:12px;}
    .prod-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    h1.page-title{font-size:19px;}

    .editor,.editor-center{min-height:0;}
    .editor{position:relative;height:100%;}
    .scenes-panel{
      position:fixed;top:0;left:0;bottom:0;width:84vw;max-width:320px;z-index:150;
      transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px #0008;
    }
    .scenes-panel.open{transform:translateX(0);}
    .props-panel{
      position:fixed;top:0;right:0;bottom:0;width:88vw;max-width:340px;z-index:150;
      transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 30px #0008;
    }
    .props-panel.open{transform:translateX(0);}
    .editor-topbar{padding:8px 10px;gap:6px;}
    .editor-topbar select.input{width:130px !important;font-size:12px;}
    .editor-canvas-wrap{padding:14px;}
    .btn-ghost span{display:inline;}

    .modal-overlay{padding:10px;align-items:flex-end;}
    .modal-box{width:100% !important;max-width:100%;max-height:92vh;border-radius:18px 18px 0 0;}

    .card-actions{opacity:1;}
    .scene-actions{opacity:1;}
    .layer-actions{opacity:1;}
  }
  @media (max-width:520px){
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    .prod-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));}
    .style-grid{grid-template-columns:repeat(2,1fr);}
    .editor-topbar select.input{width:100px !important;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== DATA / STATE ============================== */
const T = { good:'#2E8B57', danger:'#C24545' };
const MAX_VIDEO_SECONDS = 120;
const FORMATS = [
  { id:'1:1', label:'Feed 1:1', w:1080, h:1080 },
  { id:'4:5', label:'Feed 4:5', w:1080, h:1350 },
  { id:'9:16', label:'Stories / Reels 9:16', w:1080, h:1920 },
  { id:'16:9', label:'Horizontal 16:9', w:1920, h:1080 },
];
const STYLE_PRESETS = {
  minimal:  { name:'Minimalista', bg:'#FFFFFF', fg:'#14161D', border:'transparent', radius:6,  shadow:true,  weight:600 },
  claro:    { name:'Claro',       bg:'#FFFFFFE6', fg:'#14161D', border:'#D9D4C6',   radius:10, shadow:false, weight:600 },
  escuro:   { name:'Escuro',      bg:'#14161DF2', fg:'#FFFFFF', border:'transparent', radius:10, shadow:true, weight:600 },
  premium:  { name:'Premium',     bg:'#14161D', fg:'#E0A63A', border:'#E0A63A',     radius:2,  shadow:true,  weight:700 },
  moderno:  { name:'Moderno',     bg:'#3457D5', fg:'#FFFFFF', border:'transparent', radius:14, shadow:true,  weight:700 },
  promocao: { name:'Promoção',    bg:'#C24545', fg:'#FFFFFF', border:'transparent', radius:4,  shadow:true,  weight:800 },
};
const CATEGORIES = ['Sala','Quarto','Cozinha','Escritório','Decoração','Móveis','Moda','Eletrônicos','Outros'];
const TRANSITIONS = { fade:'Fade', cut:'Corte seco', 'slide-left':'Slide ←', 'slide-right':'Slide →', zoom:'Zoom' };
const MOVEMENTS = {
  auto:'Automático (variado)', 'zoom-in':'Zoom aproximando', 'zoom-out':'Zoom afastando',
  'pan-lr':'Tour → (esq. p/ direita)', 'pan-rl':'Tour ← (direita p/ esq.)',
  'pan-tb':'Tour ↓ (cima p/ baixo)', 'pan-bt':'Tour ↑ (baixo p/ cima)',
  diagonal:'Zig-zag / Orbital', static:'Estático (sem movimento)',
};
const AUTO_MOVEMENT_CYCLE = ['zoom-in','pan-lr','pan-rl','zoom-out','diagonal','pan-tb','pan-bt'];
const TEMPLATES = [
  {id:'sala', name:'Sala de Estar', category:'Sala', format:'1:1', style:'moderno'},
  {id:'quarto', name:'Quarto Aconchegante', category:'Quarto', format:'4:5', style:'claro'},
  {id:'cozinha', name:'Cozinha Gourmet', category:'Cozinha', format:'1:1', style:'minimal'},
  {id:'escritorio', name:'Home Office', category:'Escritório', format:'4:5', style:'escuro'},
  {id:'moda', name:'Look do Dia', category:'Moda', format:'9:16', style:'premium'},
  {id:'promo', name:'Oferta Relâmpago', category:'Promoções', format:'1:1', style:'promocao'},
];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const fmtPrice = (v) => { const n = parseFloat(v); if (isNaN(n)) return 'R$ 0,00'; return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const nowISO = () => new Date().toISOString();
const fmtDate = (iso) => new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const fmtMinSec = (sec) => { sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; };
const esc = (s) => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readFileAsDataURL(file, cb){ const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(file); }
function loadImage(src){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=src; }); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function newProduct(o={}) { return { id:uid(), name:'', image:null, price:'', promotionalPrice:'', sku:'', category:CATEGORIES[0], marketplace:'Loja própria', url:'', status:'active', createdAt:nowISO(), updatedAt:nowISO(), ...o }; }
function newScene(o={}) { return { id:uid(), name:'Cena', image:null, imageFit:'contain', labels:[], texts:[], ...o }; }
function newProject(name) { const scene = newScene({name:'Cena 01'}); return { id:uid(), name, createdAt:nowISO(), updatedAt:nowISO(), format:'1:1', scenes:[scene], activeSceneId:scene.id, defaultLabelStyle:null, videoConfig:null }; }
function newLabel(productId, z, style) { return { id:uid(), productId, x:50, y:50, size:1, rotation:0, pointX:50, pointY:68, style:style||'minimal', displayMode:'price-name', connectorStyle:'dashed', visible:true, locked:false, zIndex:z }; }
function newText(z) { return { id:uid(), text:'Novo texto', x:50, y:15, fontSize:32, color:'#FFFFFF', weight:700, align:'center', opacity:1, visible:true, locked:false, zIndex:z }; }

const STATE = {
  view:'dashboard',
  products:[],
  projects:[],
  currentProjectId:null,
  sel:null,
  zoom:0.62,
  toast:null,
  modal:null,
  productPickerTab:'existing',
  videoPlaying:false,
  mobileNavOpen:false,
  mobileScenesOpen:false,
  mobilePropsOpen:false,
};

function currentProject(){ return STATE.projects.find(p=>p.id===STATE.currentProjectId) || null; }
function currentScene(){ const p = currentProject(); if(!p) return null; return p.scenes.find(s=>s.id===p.activeSceneId) || p.scenes[0]; }
function productFor(id){ return STATE.products.find(p=>p.id===id); }
function touchProject(p){ if(p) p.updatedAt = nowISO(); }

function showToast(msg){ STATE.toast = msg; render(); clearTimeout(showToast._t); showToast._t = setTimeout(()=>{ STATE.toast=null; renderToastOnly(); }, 2200); }
function renderToastOnly(){ const el = document.getElementById('toast-slot'); if(el) el.innerHTML = STATE.toast ? toastHTML() : ''; }

function iconBtn(name, action, opts={}){
  const {id='', size=16, title='', extra='', cls=''} = opts;
  return `<button class="icon-btn ${cls}" data-action="${action}" data-id="${id}" title="${esc(title)}" ${extra}>${icon(name,size)}</button>`;
}

/* ============================== TOAST ============================== */
function toastHTML(){ return STATE.toast ? `<div class="toast">${icon('check',14)} ${esc(STATE.toast)}</div>` : ''; }

/* ============================== ROOT RENDER ============================== */
function render(){
  const app = document.getElementById('app');
  const anyDrawerOpen = STATE.mobileNavOpen || STATE.mobileScenesOpen || STATE.mobilePropsOpen;
  app.innerHTML = mobileTopbarHTML() + navRailHTML() +
    (anyDrawerOpen ? `<div class="mobile-backdrop" data-action="close-drawers"></div>` : '') +
    `<div class="main-view-wrap" style="flex:1;min-width:0;display:flex;flex-direction:column;">${viewHTML()}</div>` +
    `<div id="toast-slot">${toastHTML()}</div>` + modalHTML();
}

function mobileTopbarHTML(){
  const titles = {dashboard:'Dashboard', projects:'Projetos', products:'Produtos', videos:'Vídeos', 'video-studio':'Vídeo', templates:'Templates', editor:currentProject()?currentProject().name:'Editor'};
  return `<div class="mobile-topbar">
    <button class="icon-btn" data-action="toggle-mobile-nav">${icon('menu',20)}</button>
    <span class="mobile-topbar-title truncate">${esc(titles[STATE.view]||'Menu')}</span>
    <div style="width:30px;"></div>
  </div>`;
}

function navRailHTML(){
  const items = [
    {id:'dashboard', icon:'grid', label:'Dashboard'},
    {id:'projects', icon:'folder', label:'Projetos'},
    {id:'products', icon:'package', label:'Produtos'},
    {id:'videos', icon:'video', label:'Vídeos'},
    {id:'templates', icon:'layout', label:'Templates'},
  ];
  return `<div class="navrail ${STATE.mobileNavOpen?'open':''}">
    <div class="logo">${icon('tag',20)}</div>
    ${items.map(it=>{
      const active = STATE.view===it.id || (it.id==='videos' && STATE.view==='video-studio');
      return `<button data-action="nav" data-id="${it.id}" class="${active?'active':''}">${icon(it.icon,18)}<span>${it.label}</span></button>`;
    }).join('')}
  </div>`;
}

function viewHTML(){
  if(STATE.view==='dashboard') return dashboardHTML();
  if(STATE.view==='projects') return projectsHTML();
  if(STATE.view==='products') return productsHTML();
  if(STATE.view==='videos') return videosHTML();
  if(STATE.view==='video-studio') return currentProject() ? videoStudioHTML(currentProject()) : `<div class="main-view">Selecione um projeto.</div>`;
  if(STATE.view==='templates') return templatesHTML();
  if(STATE.view==='editor') return currentProject() ? editorHTML() : `<div class="main-view flex items-center justify-center" style="color:var(--ink3);">Selecione um projeto.</div>`;
  return '';
}

/* ============================== DASHBOARD ============================== */
function dashboardHTML(){
  const projects = STATE.projects, products = STATE.products;
  const totalScenes = projects.reduce((a,p)=>a+p.scenes.length,0);
  const totalLabels = projects.reduce((a,p)=>a+p.scenes.reduce((b,s)=>b+s.labels.length,0),0);
  const recent = [...projects].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,6);
  return `<div class="main-view">
    <div class="flex items-center justify-between" style="margin-bottom:28px;">
      <div><h1 class="page-title">Dashboard</h1><p class="page-sub">Visão geral dos seus anúncios visuais.</p></div>
      <button class="btn-primary" data-action="create-project">${icon('plus',16)} Criar novo anúncio</button>
    </div>
    <div class="stats-grid">
      ${statCard(projects.length,'Projetos','#3457D5')}
      ${statCard(products.length,'Produtos cadastrados','#E0A63A')}
      ${statCard(totalScenes,'Cenas','#7C6FE0')}
      ${statCard(totalLabels,'Etiquetas ativas','#2E8B57')}
    </div>
    <div class="flex items-center justify-between" style="margin-bottom:12px;">
      <h2 style="font-family:var(--font-display);color:#fff;font-size:15px;margin:0;">Projetos recentes</h2>
      <button data-action="nav" data-id="projects" style="color:var(--amber);font-size:12px;">Ver todos</button>
    </div>
    ${recent.length===0 ? emptyState('folder','Nenhum projeto ainda','Crie seu primeiro projeto, envie uma foto do ambiente ou produto e comece a posicionar etiquetas.','create-project','Criar projeto')
      : `<div class="proj-grid">${recent.map(p=>projectCard(p,false)).join('')}</div>`}
  </div>`;
}
function statCard(value,label,accent){
  return `<div class="stat-card"><div class="stat-dot" style="background:${accent}"></div><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`;
}
function emptyState(ic,title,text,action,actionLabel){
  return `<div class="empty-state"><div style="color:var(--ink3);">${icon(ic,30)}</div><h3>${title}</h3><p>${text}</p>
    ${action?`<button class="btn-primary" style="margin-top:16px;" data-action="${action}">${icon('plus',15)} ${actionLabel}</button>`:''}</div>`;
}
function projectCard(p, withActions){
  const scene = p.scenes[0];
  const totalLabels = p.scenes.reduce((a,s)=>a+s.labels.length,0);
  return `<div class="card" data-action="open-project" data-id="${p.id}">
    <div class="thumb">
      ${scene && scene.image ? `<img src="${scene.image}"/>` : icon('image',26)}
      ${withActions?`<div class="card-actions">
        ${iconBtn('copy','duplicate-project',{id:p.id,size:14,title:'Duplicar'})}
        ${confirmBtn('delete-project',p.id)}
      </div>`:''}
    </div>
    <div class="body">
      <div class="title truncate">${esc(p.name)}</div>
      <div class="meta">${p.scenes.length} cena${p.scenes.length!==1?'s':''} · ${totalLabels} etiqueta${totalLabels!==1?'s':''} · atualizado ${fmtDate(p.updatedAt)}</div>
    </div>
  </div>`;
}
function confirmBtn(action,id){
  return `<button class="icon-btn danger" data-armed="0" title="Excluir" onclick="event.stopPropagation();handleConfirmClick(this,'${action}','${id}')">${icon('trash',14)}</button>`;
}
function handleConfirmClick(btn, action, id){
  if(btn.dataset.armed==='1'){ ACTIONS[action](id); return; }
  btn.dataset.armed='1'; btn.style.background=T.danger; btn.style.color='#fff';
  btn.innerHTML = icon('trash',14)+`<span style="font-size:10px;margin-left:4px;">Confirmar</span>`;
  btn.style.width='auto'; btn.style.padding='0 8px';
  setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.style.background=''; btn.style.color=''; btn.style.width='30px'; btn.style.padding='0'; btn.innerHTML = icon('trash',14); } },2200);
}

/* ============================== PROJECTS ============================== */
function projectsHTML(){
  const projects = STATE.projects;
  return `<div class="main-view">
    <div class="flex items-center justify-between" style="margin-bottom:24px;">
      <div><h1 class="page-title">Meus Projetos</h1><p class="page-sub">${projects.length} projeto${projects.length!==1?'s':''}</p></div>
      <button class="btn-primary" data-action="open-modal" data-id="new-project">${icon('plus',16)} Novo projeto</button>
    </div>
    ${projects.length===0 ? emptyState('folder','Nenhum projeto ainda','Um projeto reúne as cenas, etiquetas e produtos de um anúncio.','open-modal-new-project','Criar projeto')
      : `<div class="proj-grid">${projects.map(p=>projectCard(p,true)).join('')}</div>`}
  </div>`;
}

/* ============================== PRODUCTS ============================== */
let productsQuery='', productsCategory='Todas';
function productsHTML(){
  const filtered = filterProducts();
  return `<div class="main-view">
    <div class="flex items-center justify-between" style="margin-bottom:24px;">
      <div><h1 class="page-title">Produtos</h1><p class="page-sub">Cadastre os produtos reais que serão usados nas etiquetas.</p></div>
      <button class="btn-primary" data-action="open-product-editor" data-id="new">${icon('plus',16)} Adicionar produto</button>
    </div>
    <div class="flex gap-3" style="margin-bottom:18px;">
      <div class="relative" style="max-width:280px;flex:1;">
        <span style="position:absolute;left:10px;top:9px;color:var(--ink3);">${icon('search',14)}</span>
        <input class="input" style="padding-left:30px;" value="${esc(productsQuery)}" placeholder="Pesquisar por nome ou SKU" oninput="productsQuery=this.value;rerenderProducts();"/>
      </div>
      <select class="input" style="width:180px;" onchange="productsCategory=this.value;rerenderProducts();">
        <option ${productsCategory==='Todas'?'selected':''}>Todas</option>
        ${CATEGORIES.map(c=>`<option ${productsCategory===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div id="products-grid-slot">${productsGridHTML(filtered)}</div>
  </div>`;
}
function filterProducts(){
  return STATE.products.filter(p=>{
    const okQ = (p.name+p.sku).toLowerCase().includes(productsQuery.toLowerCase());
    const okC = productsCategory==='Todas' || p.category===productsCategory;
    return okQ && okC;
  });
}
function productsGridHTML(filtered){
  if(filtered.length===0) return emptyState('package', STATE.products.length===0?'Nenhum produto cadastrado':'Nada encontrado','Cada produto cadastrado aqui pode ser reutilizado em quantas etiquetas e anúncios você quiser.','open-product-editor-new','Adicionar produto');
  return `<div class="prod-grid">${filtered.map(p=>`
    <div class="prod-card" style="opacity:${p.status==='inactive'?0.55:1}">
      <div class="img">${p.image?`<img src="${p.image}"/>`:icon('package',22)}</div>
      <div class="name truncate">${esc(p.name)||'Sem nome'}</div>
      <div class="sub">${esc(p.sku)||'sem SKU'} · ${esc(p.category)}</div>
      <div class="price-row">
        <span class="price-main">${fmtPrice(p.promotionalPrice||p.price)}</span>
        ${p.promotionalPrice?`<span class="price-old">${fmtPrice(p.price)}</span>`:''}
      </div>
      <div class="mt-auto flex items-center justify-between">
        <button class="status-pill ${p.status}" data-action="toggle-product-status" data-id="${p.id}">${p.status==='active'?'Ativo':'Inativo'}</button>
        <div class="flex gap-1 items-center">
          <button class="btn-ghost" style="padding:6px 10px;" data-action="open-product-editor" data-id="${p.id}">${icon('edit',12)} Editar</button>
          ${confirmBtn('delete-product',p.id)}
        </div>
      </div>
    </div>`).join('')}</div>`;
}
function rerenderProducts(){
  const slot = document.getElementById('products-grid-slot');
  if(slot) slot.innerHTML = productsGridHTML(filterProducts());
}

/* ============================== EDITOR ============================== */
function editorHTML(){
  const project = currentProject(), scene = currentScene();
  const fmt = FORMATS.find(f=>f.id===project.format) || FORMATS[0];
  return `<div class="editor">
    ${scenesPanelHTML(project)}
    <div class="editor-center">
      ${editorTopbarHTML(project, fmt, scene)}
      <div class="editor-canvas-wrap" id="canvas-wrap">${scene.image ? canvasStageHTML(scene, fmt) : uploadDropHTML(fmt)}</div>
    </div>
    ${STATE.sel ? propsPanelHTML(scene) : sidebarDefaultHTML(scene)}
  </div>`;
}

function scenesPanelHTML(project){
  return `<div class="scenes-panel ${STATE.mobileScenesOpen?'open':''}">
    <div class="scenes-head">
      ${iconBtn('chevleft','nav',{id:'projects',title:'Voltar'})}
      <input value="${esc(project.name)}" onblur="ACTIONS['rename-project'](this.value)" onkeydown="if(event.key==='Enter')this.blur()"/>
      <button class="icon-btn drawer-close-btn" data-action="close-drawers">${icon('x',18)}</button>
    </div>
    <div class="scenes-sub"><span>CENAS</span>${iconBtn('plus','add-scene',{title:'Adicionar cena'})}</div>
    <div class="scenes-list">
      ${project.scenes.map((s,i)=>`
        <div class="scene-item ${s.id===project.activeSceneId?'active':''}" data-action="set-active-scene" data-id="${s.id}">
          <div class="scene-thumb">${s.image?`<img src="${s.image}"/>`:icon('image',16)}</div>
          <div class="scene-row">
            <span>${i+1}. ${esc(s.name)}</span>
            <div class="scene-actions">
              ${iconBtn('chevleft','move-scene-left',{id:s.id,size:12})}
              ${iconBtn('chevright','move-scene-right',{id:s.id,size:12})}
              ${iconBtn('copy','duplicate-scene',{id:s.id,size:12})}
              ${iconBtn('trash','delete-scene',{id:s.id,size:12,cls:'danger'})}
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function editorTopbarHTML(project, fmt, scene){
  const fit = scene.imageFit || 'cover';
  return `<div class="editor-topbar">
    <div class="flex items-center gap-2">
      <button class="icon-btn mobile-only" data-action="toggle-scenes-panel" title="Cenas">${icon('layers2',18)}</button>
      <select class="input" style="width:190px;" onchange="ACTIONS['set-format'](this.value)">
        ${FORMATS.map(f=>`<option value="${f.id}" ${project.format===f.id?'selected':''}>${f.label} · ${f.w}×${f.h}</option>`).join('')}
      </select>
      <button class="btn-ghost" data-action="trigger-scene-upload">${icon('upload',13)} ${scene.image?'Trocar imagem':'Enviar imagem'}</button>
      <input type="file" id="scene-file-input" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="handleSceneFile(this.files[0])"/>
      ${scene.image?`<div class="seg-btn-row" style="width:auto;" title="Como a imagem se ajusta ao formato escolhido">
        <button class="seg-btn ${fit==='contain'?'selected':''}" style="padding:6px 10px;flex:none;" data-action="set-scene-fit" data-id="contain">Ver tudo</button>

function canvasStageHTML(scene, fmt){
  const baseW = 620, baseH = Math.round(baseW*(fmt.h/fmt.w));
  const labels = [...scene.labels].sort((a,b)=>a.zIndex-b.zIndex);
  const texts = [...scene.texts].sort((a,b)=>a.zIndex-b.zIndex);
  const connectors = labels.filter(l=>l.visible).map(l=>{
    const selected = STATE.sel && STATE.sel.type==='label' && STATE.sel.id===l.id;
    return `<line x1="${l.x}" y1="${l.y}" x2="${l.pointX}" y2="${l.pointY}" stroke="${selected?'#E0A63A':'#FFFFFFCC'}" stroke-width="0.25"
      stroke-dasharray="${l.connectorStyle==='dashed'?'1.2,1':'0'}" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const labelEls = labels.filter(l=>l.visible).map(l=>{
    const product = productFor(l.productId);
    const preset = STYLE_PRESETS[l.style];
    const selected = STATE.sel && STATE.sel.type==='label' && STATE.sel.id===l.id;
    let content = '';
    const price = fmtPrice(product && (product.promotionalPrice||product.price));
    const name = (product && product.name) || 'Produto';
    const sku = (product && product.sku) || '—';
    if(l.displayMode==='price-name') content = `<span style="font-family:var(--font-mono);font-size:${13*l.size}px;font-weight:${preset.weight};">${price} <span style="opacity:.85;font-family:var(--font-body);">· ${esc(name)}</span></span>`;
    else if(l.displayMode==='name-price') content = `<div><div style="font-size:${11.5*l.size}px;font-weight:500;opacity:.9;">${esc(name)}</div><div style="font-family:var(--font-mono);font-size:${14*l.size}px;font-weight:${preset.weight};">${price}</div></div>`;
    else content = `<div><div style="font-size:${11.5*l.size}px;font-weight:500;opacity:.9;">${esc(name)}</div><div style="font-family:var(--font-mono);font-size:${14*l.size}px;font-weight:${preset.weight};">${price}</div><div style="font-family:var(--font-mono);font-size:${9*l.size}px;opacity:.65;">SKU: ${esc(sku)}</div></div>`;

    return `<div class="cv-point" data-drag="point" data-id="${l.id}" style="left:${l.pointX}%;top:${l.pointY}%;background:${selected?'#E0A63A':'#fff'};border:2px solid #3457D5;"></div>
      <div class="cv-label" data-drag="move" data-id="${l.id}" style="left:${l.x}%;top:${l.y}%;transform:translate(-50%,-50%) rotate(${l.rotation}deg);z-index:${100+l.zIndex};
        outline:${selected?'2px solid #E0A63A':'none'};outline-offset:3px;border-radius:${preset.radius+4}px;">
        <div class="box" style="background:${preset.bg};color:${preset.fg};border:${preset.border!=='transparent'?'1.4px solid '+preset.border:'none'};
          border-radius:${preset.radius}px;padding:${7*l.size}px ${12*l.size}px;box-shadow:${preset.shadow?'0 6px 18px #0000004d':'none'};">${content}</div>
        ${selected ? `<div class="cv-resize" data-drag="resize" data-id="${l.id}"></div>` : ''}
      </div>`;
  }).join('');

  const textEls = texts.filter(t=>t.visible).map(t=>{
    const selected = STATE.sel && STATE.sel.type==='text' && STATE.sel.id===t.id;
    return `<div class="cv-text" data-drag="move" data-id="${t.id}" data-kind="text" style="left:${t.x}%;top:${t.y}%;transform:translate(-50%,-50%);z-index:${100+t.zIndex};
      outline:${selected?'2px solid #E0A63A':'none'};outline-offset:4px;text-align:${t.align};opacity:${t.opacity};max-width:${baseW*0.85}px;white-space:pre-wrap;">
      <span style="font-family:var(--font-display);color:${t.color};font-size:${t.fontSize*(baseW/1080)*1.8}px;font-weight:${t.weight};">${esc(t.text)}</span>
      ${selected ? `<div class="cv-resize" data-drag="resizeText" data-id="${t.id}"></div>` : ''}
    </div>`;
  }).join('');

  return `<div style="transform:scale(${STATE.zoom});transform-origin:center center;">
    <div class="canvas-stage" id="canvas-stage" data-action="deselect" style="width:${baseW}px;height:${baseH}px;">
      <img class="scene-bg" src="${scene.image}" style="object-fit:${scene.imageFit||'cover'};"/>
      <svg class="absolute" style="inset:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 100 100" preserveAspectRatio="none">${connectors}</svg>
      ${labelEls}

    </div>
  </div>`;
}

function ensureVideoConfig(project){
  if(!project.videoConfig) project.videoConfig = { order:[], settings:{}, speed:1 };
  const vc = project.videoConfig;
  const known = new Set(vc.order);
  project.scenes.forEach(s=>{
    if(!known.has(s.id)) vc.order.push(s.id);
    if(!vc.settings[s.id]) vc.settings[s.id] = { included:true, duration:4, transition:'fade', movement:'auto' };
    else if(vc.settings[s.id].movement===undefined) vc.settings[s.id].movement = 'auto';
  });
  vc.order = vc.order.filter(id=>project.scenes.some(s=>s.id===id));
  Object.keys(vc.settings).forEach(id=>{ if(!project.scenes.some(s=>s.id===id)) delete vc.settings[id]; });
  return vc;
}
function videoTotalSeconds(project){
  const vc = ensureVideoConfig(project);
  return vc.order.filter(id=>vc.settings[id].included).reduce((a,id)=>a+vc.settings[id].duration,0);
}
