    <h1 class="page-title">Templates</h1><p class="page-sub">Comece um projeto já configurado com formato e estilo de etiqueta — depois é só enviar sua imagem e cadastrar seus produtos.</p>
    <div class="prod-grid" style="margin-top:20px;">${TEMPLATES.map(t=>{
      const preset = STYLE_PRESETS[t.style];
      return `<div class="prod-card">
        <div class="img" style="background:${preset.bg};display:flex;align-items:center;justify-content:center;">
          <span style="color:${preset.fg};font-family:var(--font-display);font-weight:700;font-size:13px;text-align:center;padding:0 10px;">${t.name}</span>
        </div>
        <div class="name">${t.name}</div>
        <div class="sub">${t.category} · formato ${t.format}</div>
        <button class="btn-primary" style="justify-content:center;margin-top:8px;" data-action="use-template" data-id="${t.id}">${icon('plus',14)} Usar template</button>
      </div>`;
    }).join('')}</div>
  </div>`;
}

/* ============================== MODALS ============================== */
function modalHTML(){
  if(!STATE.modal) return '';
  const m = STATE.modal;
  if(m.type==='new-project') return modalWrap('Novo projeto', newProjectModalBody(), 400);
  if(m.type==='product-editor') return modalWrap(m.product.name ? 'Editar produto' : 'Novo produto', productEditorBody(m.product), 460);
  if(m.type==='product-picker') return modalWrap('Adicionar etiqueta de produto', productPickerBody(), 460);
  if(m.type==='export') return modalWrap('Exportar imagem', exportModalBody(), 420);
  if(m.type==='interactive') return modalWrap('Experiência interativa — pré-visualização', interactiveModalBody(), 480);
  return '';
}
function modalWrap(title, body, width){
  return `<div class="modal-overlay" data-action="close-modal">
    <div class="modal-box" style="width:${width}px;" data-action="noop">
      <div class="modal-head"><h3>${title}</h3><button data-action="close-modal">${icon('x',18)}</button></div>
      <div class="modal-body" id="modal-body-slot">${body}</div>
    </div>
  </div>`;
}
function rerenderModalBody(html){ const el = document.getElementById('modal-body-slot'); if(el) el.innerHTML = html; }

function newProjectModalBody(){
  return `<div class="field"><span class="field-label">Nome do projeto</span>
    <input class="input" id="new-project-name" placeholder="Ex: Coleção Sala de Estar — Agosto" onkeydown="if(event.key==='Enter')ACTIONS['submit-new-project']()"/></div>
    <button class="btn-primary w-full" style="justify-content:center;margin-top:8px;" data-action="submit-new-project">Criar e abrir editor</button>`;
}

let draftProduct = null;
function productEditorBody(product){
  draftProduct = {...product};
  return renderProductEditorFields(draftProduct, false);
}
function renderProductEditorFields(p, forPicker){
  return `<div class="flex gap-3" style="margin-bottom:2px;">
    <div>
      <div class="cursor-pointer" data-action="trigger-product-image" style="width:${forPicker?72:96}px;height:${forPicker?72:96}px;border-radius:12px;background:var(--ink-soft);border:1px dashed var(--panel-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;"/>`:icon('upload',18)}
      </div>
      <input type="file" id="product-image-input" accept="image/*" class="hidden" onchange="handleProductImage(this.files[0], ${forPicker})"/>
    </div>
    <div class="flex-1">
      <div class="field"><span class="field-label">Nome do produto</span><input class="input" value="${esc(p.name)}" placeholder="Ex: Luminária Decorativa" oninput="draftProduct.name=this.value"/></div>
      ${!forPicker?`<div class="field"><span class="field-label">Categoria</span><select class="input" onchange="draftProduct.category=this.value">${CATEGORIES.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`:''}
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;">
    <div class="field"><span class="field-label">Preço (R$)</span><input class="input" type="number" step="0.01" value="${esc(p.price)}" placeholder="229.90" oninput="draftProduct.price=this.value"/></div>
    <div class="field"><span class="field-label">${forPicker?'SKU':'Preço promocional (opcional)'}</span>
      ${forPicker ? `<input class="input" value="${esc(p.sku)}" placeholder="CAD-001" style="font-family:var(--font-mono);" oninput="draftProduct.sku=this.value"/>`
        : `<input class="input" type="number" step="0.01" value="${esc(p.promotionalPrice)}" placeholder="199.90" oninput="draftProduct.promotionalPrice=this.value"/>`}
    </div>
    ${!forPicker?`<div class="field"><span class="field-label">Código / SKU</span><input class="input" value="${esc(p.sku)}" placeholder="LUM-001" style="font-family:var(--font-mono);" oninput="draftProduct.sku=this.value"/></div>
    <div class="field"><span class="field-label">Marketplace</span><input class="input" value="${esc(p.marketplace)}" placeholder="Loja própria" oninput="draftProduct.marketplace=this.value"/></div>`:''}
  </div>
  <div class="field"><span class="field-label">Link do produto (não aparece na arte)</span><input class="input" value="${esc(p.url)}" placeholder="https://minhaloja.com/luminaria" oninput="draftProduct.url=this.value"/></div>
  ${!forPicker?`<div class="field"><span class="field-label">Status</span><select class="input" onchange="draftProduct.status=this.value">
      <option value="active" ${p.status==='active'?'selected':''}>Ativo</option><option value="inactive" ${p.status==='inactive'?'selected':''}>Inativo</option></select></div>`:''}
  <button class="btn-primary w-full" style="justify-content:center;margin-top:6px;" data-action="${forPicker?'submit-inline-product':'submit-product-editor'}">
    ${forPicker?'Cadastrar e criar etiqueta':'Salvar produto'}</button>`;
}
function handleProductImage(file, forPicker){ if(!file) return; readFileAsDataURL(file,(d)=>{ draftProduct.image=d; rerenderModalBody(renderProductEditorFields(draftProduct, forPicker)); }); }

function productPickerBody(){
  return `<div class="tabbar">
      <button class="${STATE.productPickerTab==='existing'?'selected':''}" data-action="picker-tab" data-id="existing">Produto existente</button>
      <button class="${STATE.productPickerTab==='new'?'selected':''}" data-action="picker-tab" data-id="new">Cadastrar novo</button>
    </div>
    <div id="picker-tab-body">${STATE.productPickerTab==='existing' ? pickerExistingBody('') : pickerNewBody()}</div>`;
}
function pickerExistingBody(query){
  const list = STATE.products.filter(p=>p.status==='active');
  const filtered = list.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));
  return `<div class="relative" style="margin-bottom:12px;">
      <span style="position:absolute;left:10px;top:9px;color:var(--ink3);">${icon('search',14)}</span>
      <input class="input" style="padding-left:30px;" value="${esc(query)}" placeholder="Buscar produto cadastrado" oninput="filterPicker(this.value)"/>
    </div>
    <div id="picker-list" style="max-height:288px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;">${pickerListHTML(filtered)}</div>`;
}
function pickerListHTML(filtered){
  if(filtered.length===0) return `<p style="color:var(--ink3);font-size:13px;text-align:center;padding:24px 0;">Nenhum produto ativo encontrado. Cadastre um novo produto na aba ao lado.</p>`;
  return filtered.map(p=>`<div class="flex items-center gap-2_5 cursor-pointer" style="background:var(--ink-soft);border-radius:12px;padding:8px;" data-action="pick-product" data-id="${p.id}">
    ${p.image?`<img src="${p.image}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;"/>`:`<div style="width:38px;height:38px;border-radius:8px;background:var(--panel-soft);display:flex;align-items:center;justify-content:center;">${icon('package',15)}</div>`}
    <div style="min-width:0;flex:1;"><div class="truncate" style="color:#fff;font-size:12.5px;font-weight:600;">${esc(p.name)}</div><div style="color:var(--ink3);font-size:11px;">${esc(p.sku)||'sem SKU'}</div></div>
    <span style="color:var(--amber);font-size:12.5px;font-family:var(--font-mono);">${fmtPrice(p.promotionalPrice||p.price)}</span>
  </div>`).join('');
}
function filterPicker(q){ const list = STATE.products.filter(p=>p.status==='active'); const el=document.getElementById('picker-list'); if(el) el.innerHTML = pickerListHTML(list.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()))); }
function pickerNewBody(){ draftProduct = newProduct(); return renderProductEditorFields(draftProduct, true); }

function exportModalBody(){
  const project = currentProject();
  const fmt = FORMATS.find(f=>f.id===project.format)||FORMATS[0];
  return `<div class="field"><span class="field-label">Formato</span>
    <select class="input" onchange="ACTIONS['set-format'](this.value)">
      ${FORMATS.map(f=>`<option value="${f.id}" ${f.id===fmt.id?'selected':''}>${f.label} · ${f.w}×${f.h}</option>`).join('')}
    </select></div>
    <div class="field"><span class="field-label">Tipo de arquivo</span>
      <div class="seg-btn-row">
        <button class="seg-btn selected" id="ft-png" data-action="set-filetype" data-id="png" style="text-transform:uppercase;">png</button>
        <button class="seg-btn" id="ft-jpg" data-action="set-filetype" data-id="jpg" style="text-transform:uppercase;">jpg</button>
      </div></div>
    <p style="color:var(--ink3);font-size:11.5px;line-height:1.5;margin-bottom:14px;">Os links dos produtos ficam salvos apenas internamente — nenhuma URL é desenhada sobre a imagem exportada.</p>
    <button class="btn-primary w-full" style="justify-content:center;" id="export-btn" data-action="do-export">${icon('download',15)} Baixar imagem</button>`;
}
let exportFileType = 'png';

function interactiveModalBody(){
  const scene = currentScene();
  return `<p style="color:var(--ink3);font-size:11.5px;line-height:1.5;margin-bottom:12px;">
    Simulação da rota <code style="font-family:var(--font-mono);color:var(--amber);">/anuncio/:id</code>. Ao publicar de verdade, cada etiqueta abre o link real do produto.</p>
    <div class="relative" style="aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#000;">
      <img src="${scene.image}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:${scene.imageFit||'cover'};"/>
      ${scene.labels.filter(l=>l.visible).map(l=>{
        const product = productFor(l.productId); const preset = STYLE_PRESETS[l.style];
        const price = fmtPrice(product&&(product.promotionalPrice||product.price));
        const name = esc(product&&product.name);
        const sku = esc(product&&product.sku || '—');
        let inner = '';
        if(l.displayMode==='price-name') inner = `<span style="font-family:var(--font-mono);">${price}</span> <span style="opacity:.85;">· ${name}</span>`;
        else if(l.displayMode==='name-price') inner = `<div style="font-size:10.5px;font-weight:500;opacity:.9;">${name}</div><div style="font-family:var(--font-mono);">${price}</div>`;
        else inner = `<div style="font-size:10.5px;font-weight:500;opacity:.9;">${name}</div><div style="font-family:var(--font-mono);">${price}</div><div style="font-family:var(--font-mono);font-size:9.5px;opacity:.65;">SKU: ${sku}</div>`;
        return `<a href="${esc(product&&product.url||'#')}" target="_blank" rel="noreferrer" class="absolute" style="left:${l.x}%;top:${l.y}%;transform:translate(-50%,-50%);">
          <div style="background:${preset.bg};color:${preset.fg};border-radius:${preset.radius}px;padding:6px 11px;font-size:12px;font-weight:${preset.weight};box-shadow:0 4px 14px #0006;cursor:pointer;line-height:1.3;">
            ${inner}</div></a>`;
      }).join('')}
    </div>
    <p style="color:var(--ink3);font-size:11px;margin-top:10px;">Clique em uma etiqueta para abrir o link do produto em uma nova aba.</p>`;
}

/* ============================== ACTIONS ============================== */
const ACTIONS = {
  'nav': (id) => {
    if(STATE.videoPlaying){ showToast('Aguarde o vídeo terminar'); return; }
    STATE.mobileNavOpen=false; STATE.mobileScenesOpen=false; STATE.mobilePropsOpen=false;
    if(id==='video-studio-current'){ if(!currentProject()){ return; } STATE.view='video-studio'; STATE.sel=null; render(); return; }
    STATE.view = id; if(id!=='editor' && id!=='video-studio') STATE.currentProjectId = (id==='videos'||id==='templates') ? STATE.currentProjectId : null;
    if(id==='dashboard'||id==='projects'||id==='products') STATE.currentProjectId=null;
    STATE.sel=null; render();
  },
  'create-project': () => { const p = newProject('Projeto sem título'); STATE.projects.unshift(p); STATE.currentProjectId=p.id; STATE.view='editor'; STATE.sel=null; render(); },
  'open-project': (id) => { STATE.currentProjectId=id; STATE.view='editor'; STATE.sel=null; render(); },
  'delete-project': (id) => { STATE.projects = STATE.projects.filter(p=>p.id!==id); if(STATE.currentProjectId===id){STATE.currentProjectId=null;STATE.view='projects';} render(); },
  'duplicate-project': (id) => {
    const p = STATE.projects.find(x=>x.id===id); if(!p) return;
    const copy = {...p, id:uid(), name:p.name+' (cópia)', createdAt:nowISO(), updatedAt:nowISO(),
      scenes:p.scenes.map(s=>({...s,id:uid(),labels:s.labels.map(l=>({...l,id:uid()})),texts:s.texts.map(t=>({...t,id:uid()}))})),
      videoConfig:null };
    copy.activeSceneId = copy.scenes[0].id;
    STATE.projects.unshift(copy); render();
  },
  'open-modal': (id) => { if(id==='new-project'){ STATE.modal={type:'new-project'}; render(); setTimeout(()=>{const el=document.getElementById('new-project-name'); if(el) el.focus();},0);} },
  'open-modal-new-project': () => ACTIONS['open-modal']('new-project'),
  'close-modal': () => { STATE.modal=null; render(); },
  'submit-new-project': () => {
    const el = document.getElementById('new-project-name');
    const name = (el?el.value:'').trim() || 'Projeto sem título';
    const p = newProject(name); STATE.projects.unshift(p); STATE.currentProjectId=p.id; STATE.modal=null; STATE.view='editor'; STATE.sel=null; render();
  },

  'open-product-editor': (id) => { STATE.modal={type:'product-editor', product: id==='new' ? newProduct() : STATE.products.find(p=>p.id===id)}; render(); },
  'open-product-editor-new': () => ACTIONS['open-product-editor']('new'),
  'trigger-product-image': () => { const el=document.getElementById('product-image-input'); if(el) el.click(); },
  'submit-product-editor': () => {
    if(!draftProduct.name){ showToast('Informe o nome do produto'); return; }
    const exists = STATE.products.some(x=>x.id===draftProduct.id);
    if(exists) STATE.products = STATE.products.map(x=>x.id===draftProduct.id?{...draftProduct,updatedAt:nowISO()}:x);
    else STATE.products.unshift({...draftProduct, id:draftProduct.id||uid(), updatedAt:nowISO()});
    STATE.modal=null; render(); showToast('Produto salvo');
  },
  'toggle-product-status': (id) => { STATE.products = STATE.products.map(p=>p.id===id?{...p,status:p.status==='active'?'inactive':'active'}:p); rerenderProducts(); },
  'delete-product': (id) => { STATE.products = STATE.products.filter(p=>p.id!==id); rerenderProducts(); showToast('Produto excluído'); },

  'add-scene': () => { const p = currentProject(); const s = newScene({name:`Cena ${String(p.scenes.length+1).padStart(2,'0')}`}); p.scenes.push(s); p.activeSceneId=s.id; touchProject(p); STATE.sel=null; render(); },
  'duplicate-scene': (id) => { const p = currentProject(); const s = p.scenes.find(x=>x.id===id); const copy = {...s,id:uid(),name:s.name+' (cópia)', labels:s.labels.map(l=>({...l,id:uid()})), texts:s.texts.map(t=>({...t,id:uid()}))}; p.scenes.push(copy); p.activeSceneId=copy.id; touchProject(p); render(); },
  'delete-scene': (id) => { const p = currentProject(); if(p.scenes.length<=1){ showToast('O projeto precisa de ao menos 1 cena'); return; } p.scenes = p.scenes.filter(s=>s.id!==id); if(p.activeSceneId===id) p.activeSceneId=p.scenes[0].id; touchProject(p); render(); },
  'set-active-scene': (id) => { currentProject().activeSceneId = id; STATE.sel=null; render(); },
  'move-scene-left': (id) => moveScene(id,-1), 'move-scene-right': (id) => moveScene(id,1),
  'rename-project': (val) => { const p = currentProject(); if(!p) return; p.name = val.trim()||'Projeto sem título'; touchProject(p); },

  'trigger-scene-upload': () => { const el = document.getElementById('scene-file-input'); if(el) el.click(); },
  'set-format': (id) => { currentProject().format = id; touchProject(currentProject()); render(); },
  'set-scene-fit': (id) => { const s = currentScene(); if(!s) return; s.imageFit = id; touchProject(currentProject()); render(); showToast('Modo alterado — se as etiquetas ficarem fora do produto, arraste o ponto indicador de novo'); },
  'zoom-in': () => { STATE.zoom = clamp(STATE.zoom+0.1,0.2,2); render(); },
  'zoom-out': () => { STATE.zoom = clamp(STATE.zoom-0.1,0.2,2); render(); },
  'zoom-fit': () => {
    const project = currentProject(), scene = currentScene();
    if(project && scene){
      const fmt = FORMATS.find(f=>f.id===project.format)||FORMATS[0];
      const baseW = 620, baseH = Math.round(baseW*(fmt.h/fmt.w));
      const wrap = document.getElementById('canvas-wrap');
      const availW = (wrap?wrap.clientWidth:620) - 40, availH = (wrap?wrap.clientHeight:620) - 40;
      STATE.zoom = clamp(Math.min(availW/baseW, availH/baseH), 0.2, 1.4);
    } else { STATE.zoom = 0.62; }
    render();
  },

  'open-product-picker': () => { STATE.productPickerTab = STATE.products.length ? 'existing' : 'new'; STATE.modal={type:'product-picker'}; render(); },
  'picker-tab': (id) => { STATE.productPickerTab = id; rerenderModalBody(id==='existing' ? pickerExistingBody('') : pickerNewBody()); },
  'pick-product': (id) => { addLabelForProduct(id); },
  'submit-inline-product': () => {
    if(!draftProduct.name || !draftProduct.price){ showToast('Informe nome e preço do produto'); return; }
    const p = {...draftProduct, id: uid()};
    STATE.products.unshift(p);
    addLabelForProduct(p.id);
  },

  'add-text': () => { const s = currentScene(); const z = maxZ(s)+1; const t = newText(z); s.texts.push(t); STATE.sel={type:'text',id:t.id}; touchProject(currentProject()); render(); },
  'select-layer': (id, el) => { const kind = el.dataset.kind; STATE.sel = {type:kind,id}; render(); },
  'deselect': () => { STATE.sel=null; render(); },
  'deselect-btn': () => { STATE.sel=null; render(); },
  'reorder-up': (id, el) => reorder({type:el.dataset.kind,id}, 1),
  'reorder-down': (id, el) => reorder({type:el.dataset.kind,id}, -1),
  'toggle-visible': (id, el) => patchByKind(el.dataset.kind, id, o=>({visible:!o.visible})),
  'toggle-locked': (id, el) => patchByKind(el.dataset.kind, id, o=>({locked:!o.locked})),

  'patch-obj': (key, val) => { patchSelected({[key]: val}); },
  'reset-rotation': () => patchSelected({rotation:0}),
  'duplicate-selected': () => duplicateSelected(),
  'toggle-visible-selected': () => { const o = getSelectedObj(); patchSelected({visible:!o.visible}); },
  'toggle-locked-selected': () => { const o = getSelectedObj(); patchSelected({locked:!o.locked}); },
  'delete-selected': () => deleteSelected(),

  'open-export': () => { exportFileType='png'; STATE.modal={type:'export'}; render(); },
  'set-filetype': (id) => { exportFileType=id; const a=document.getElementById('ft-png'), b=document.getElementById('ft-jpg'); if(a)a.classList.toggle('selected',id==='png'); if(b)b.classList.toggle('selected',id==='jpg'); },
  'do-export': () => doExport(),
  'open-interactive-preview': () => { STATE.modal={type:'interactive'}; render(); },

  'open-video-studio': (id) => { STATE.currentProjectId=id; STATE.view='video-studio'; STATE.sel=null; render(); },
  'toggle-video-scene': (id, checked) => {
    if(STATE.videoPlaying) return;
    const project = currentProject(); const vc = ensureVideoConfig(project);
    vc.settings[id].included = !!checked;
    const total = videoTotalSeconds(project);
    if(total>MAX_VIDEO_SECONDS){ vc.settings[id].duration = Math.max(1, vc.settings[id].duration-(total-MAX_VIDEO_SECONDS)); }
    touchProject(project); render();
  },
  'set-video-duration': (id, val) => {
    if(STATE.videoPlaying) return;
    const project = currentProject(); const vc = ensureVideoConfig(project);
    let v = clamp(parseInt(val)||1,1,60);
    const others = videoTotalSeconds(project) - (vc.settings[id].included ? vc.settings[id].duration : 0);
    const maxAllowed = Math.max(1, MAX_VIDEO_SECONDS - others);
    vc.settings[id].duration = Math.min(v, maxAllowed);
    touchProject(project); render();
  },
  'set-video-transition': (id, val) => { if(STATE.videoPlaying) return; const project=currentProject(); ensureVideoConfig(project).settings[id].transition = val; touchProject(project); },
  'set-video-movement': (id, val) => { if(STATE.videoPlaying) return; const project=currentProject(); ensureVideoConfig(project).settings[id].movement = val; touchProject(project); },
  'move-video-scene': (id, el) => {
    if(STATE.videoPlaying) return;
    const dir = parseInt(el.dataset.dir); const project=currentProject(); const vc=ensureVideoConfig(project);
    const idx=vc.order.indexOf(id); const j=idx+dir; if(j<0||j>=vc.order.length) return;
    [vc.order[idx],vc.order[j]]=[vc.order[j],vc.order[idx]]; touchProject(project); render();
  },
  'set-video-speed': (sp) => { if(STATE.videoPlaying) return; const project=currentProject(); ensureVideoConfig(project).speed=parseFloat(sp); touchProject(project); render(); },
  'play-video-preview': () => {
    if(STATE.videoPlaying){ STATE.videoPlaying=false; return; }
    runTimeline(currentProject(), {record:false});
  },
  'export-video': () => {
    if(STATE.videoPlaying){ showToast('Aguarde a operação atual terminar'); return; }
    runTimeline(currentProject(), {record:true});
  },

  'use-template': (id) => {
    const tpl = TEMPLATES.find(t=>t.id===id); if(!tpl) return;
    const p = newProject(`${tpl.name} — novo projeto`);
    p.format = tpl.format; p.defaultLabelStyle = tpl.style;
    STATE.projects.unshift(p); STATE.currentProjectId=p.id; STATE.view='editor'; STATE.sel=null; render();
    showToast('Projeto criado a partir do template. Envie a imagem para começar.');
  },

  'toggle-mobile-nav': () => { STATE.mobileNavOpen = !STATE.mobileNavOpen; STATE.mobileScenesOpen=false; STATE.mobilePropsOpen=false; render(); },
  'toggle-scenes-panel': () => { STATE.mobileScenesOpen = !STATE.mobileScenesOpen; STATE.mobileNavOpen=false; STATE.mobilePropsOpen=false; render(); },
  'toggle-props-panel': () => { STATE.mobilePropsOpen = !STATE.mobilePropsOpen; STATE.mobileNavOpen=false; STATE.mobileScenesOpen=false; render(); },
  'close-drawers': () => { STATE.mobileNavOpen=false; STATE.mobileScenesOpen=false; STATE.mobilePropsOpen=false; render(); },
};

document.addEventListener('click', (e) => {
  if(e.target.closest('[data-drag]')) return;
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='patch-obj' && el.dataset.key){ patchSelected({[el.dataset.key]: el.dataset.val}); return; }
  if(!ACTIONS[action]) return;
  const id = el.dataset.id;
  ACTIONS[action](id, el);
});

function moveScene(id, dir){
  const p = currentProject(); const idx = p.scenes.findIndex(s=>s.id===id); const j = idx+dir;
  if(j<0||j>=p.scenes.length) return;
  const arr = p.scenes; [arr[idx],arr[j]] = [arr[j],arr[idx]]; touchProject(p); render();
}
function maxZ(s){ return Math.max(0, ...s.labels.map(l=>l.zIndex), ...s.texts.map(t=>t.zIndex)); }
function addLabelForProduct(productId){
  const s = currentScene(); const project = currentProject();
  const l = newLabel(productId, maxZ(s)+1, project.defaultLabelStyle);
  s.labels.push(l);
  STATE.sel = {type:'label', id:l.id}; touchProject(project); STATE.modal=null; render();
}
function patchByKind(kind, id, fn){
  const s = currentScene(); const arr = kind==='label'?s.labels:s.texts;
  const o = arr.find(x=>x.id===id); if(!o) return; Object.assign(o, fn(o)); touchProject(currentProject()); render();
}
function getSelectedObj(){ const s = currentScene(); const sel = STATE.sel; if(!s||!sel) return null; return sel.type==='label' ? s.labels.find(l=>l.id===sel.id) : s.texts.find(t=>t.id===sel.id); }
function patchSelected(patch){ const o = getSelectedObj(); if(!o) return; Object.assign(o, patch); touchProject(currentProject()); render(); }
function reorder(sel, dir){
  const s = currentScene(); const arr = sel.type==='label' ? s.labels : s.texts;
  const sorted = [...arr].sort((a,b)=>a.zIndex-b.zIndex);
  const idx = sorted.findIndex(o=>o.id===sel.id); const j = idx+dir;
  if(j<0||j>=sorted.length) return;
  const tmp = sorted[idx].zIndex; sorted[idx].zIndex = sorted[j].zIndex; sorted[j].zIndex = tmp;
  touchProject(currentProject()); render();
}
function duplicateSelected(){
  const s = currentScene(); const sel = STATE.sel; const o = getSelectedObj(); if(!o) return;
  const copy = {...o, id:uid(), x:clamp(o.x+4,2,98), y:clamp(o.y+4,2,98), zIndex:maxZ(s)+1};
  if(sel.type==='label') s.labels.push(copy); else s.texts.push(copy);
  STATE.sel = {type:sel.type, id:copy.id}; touchProject(currentProject()); render();
}
function deleteSelected(){
  const s = currentScene(); const sel = STATE.sel; if(!sel) return;
  if(sel.type==='label') s.labels = s.labels.filter(l=>l.id!==sel.id); else s.texts = s.texts.filter(t=>t.id!==sel.id);
  STATE.sel=null; touchProject(currentProject()); render();
}
function handleSceneFile(file){ if(!file) return; readFileAsDataURL(file,(d)=>{ currentScene().image=d; touchProject(currentProject()); render(); setTimeout(()=>ACTIONS['zoom-fit'](),0); }); }

/* ============================== DRAG (labels / points / resize / text) ============================== */
let dragCtx = null;
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-drag]');
  if(!el) return;
  e.stopPropagation();
  const kind = el.dataset.drag, id = el.dataset.id;
  const s = currentScene(); if(!s) return;
  let obj = s.labels.find(l=>l.id===id) || s.texts.find(t=>t.id===id);
  if(!obj) return;
  const type = s.labels.includes(obj) ? 'label' : 'text';
  if(obj.locked){ STATE.sel = {type, id}; render(); return; }
  STATE.sel = {type, id};
  const stage = document.getElementById('canvas-stage');
  if(!stage) return;
  const rect = stage.getBoundingClientRect();
  dragCtx = { kind, id, type, rect, startClientX:e.clientX, startClientY:e.clientY, start:{...obj} };
  render();
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
});
function onDragMove(e){
  if(!dragCtx) return;
  const d = dragCtx;
  const dxPct = ((e.clientX-d.startClientX)/d.rect.width)*100;
  const dyPct = ((e.clientY-d.startClientY)/d.rect.height)*100;
  const s = currentScene(); if(!s) return;
  const arr = d.type==='label' ? s.labels : s.texts;
  const obj = arr.find(o=>o.id===d.id);
  if(!obj) return;
  if(d.kind==='move'){ obj.x = clamp(d.start.x+dxPct,1,99); obj.y = clamp(d.start.y+dyPct,1,99); }
  else if(d.kind==='point'){ obj.pointX = clamp(d.start.pointX+dxPct,0,100); obj.pointY = clamp(d.start.pointY+dyPct,0,100); }
  else if(d.kind==='resize'){ const delta=(e.clientX-d.startClientX)/d.rect.width; obj.size = clamp(d.start.size+delta*2.2,0.5,3); }
  else if(d.kind==='resizeText'){ const delta=(e.clientX-d.startClientX); obj.fontSize = clamp(d.start.fontSize+delta*0.35,10,140); }
  renderCanvasOnly();
}
function onDragEnd(){
  if(dragCtx) touchProject(currentProject());
  dragCtx=null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  render();
}
function renderCanvasOnly(){
  const wrap = document.getElementById('canvas-wrap');
  const project = currentProject(), scene = currentScene();
  if(!project || !scene) return;
  const fmt = FORMATS.find(f=>f.id===project.format)||FORMATS[0];
  if(wrap) wrap.innerHTML = canvasStageHTML(scene, fmt);
}

/* ============================== SHARED CANVAS-2D DRAWING (image export + video frames) ============================== */
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCover(ctx, img, W, H){
  const ir = img.width/img.height, cr = W/H;
  let dw,dh,dx,dy;
  if(ir>cr){ dh=H; dw=H*ir; dx=(W-dw)/2; dy=0; } else { dw=W; dh=W/ir; dx=0; dy=(H-dh)/2; }
  ctx.drawImage(img,dx,dy,dw,dh);
}
function drawContain(ctx, img, W, H){
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const ir = img.width/img.height, cr = W/H;
  let dw,dh,dx,dy;
  if(ir>cr){ dw=W; dh=W/ir; dx=0; dy=(H-dh)/2; } else { dh=H; dw=H*ir; dy=0; dx=(W-dw)/2; }
  ctx.drawImage(img,dx,dy,dw,dh);
}
function drawSceneToCanvas(ctx, img, W, H, scene){
  if((scene.imageFit||'cover')==='cover') drawCover(ctx, img, W, H);
  else drawContain(ctx, img, W, H);
  const scaleF = W/1080;
  const sortedLabels = [...scene.labels].filter(l=>l.visible).sort((a,b)=>a.zIndex-b.zIndex);
  for(const l of sortedLabels){
    const product = productFor(l.productId); const preset = STYLE_PRESETS[l.style];
    const px=(l.x/100)*W, py=(l.y/100)*H, ppx=(l.pointX/100)*W, ppy=(l.pointY/100)*H;

    ctx.save(); ctx.strokeStyle='#FFFFFFCC'; ctx.lineWidth=2*scaleF;
    if(l.connectorStyle==='dashed') ctx.setLineDash([8*scaleF,6*scaleF]);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ppx,ppy); ctx.stroke(); ctx.restore();
    ctx.fillStyle='#fff'; ctx.strokeStyle='#3457D5'; ctx.lineWidth=3*scaleF;
    ctx.beginPath(); ctx.arc(ppx,ppy,7*scaleF,0,Math.PI*2); ctx.fill(); ctx.stroke();

    const priceTxt = fmtPrice(product && (product.promotionalPrice||product.price));
    const nameTxt = (product && product.name) || 'Produto';
    const skuTxt = 'SKU: ' + ((product && product.sku) || '—');
    let lines=[]; const fs = 15*scaleF*l.size;
    if(l.displayMode==='price-name') lines=[{t:`${priceTxt} · ${nameTxt}`, fs, w:preset.weight}];
    else if(l.displayMode==='name-price') lines=[{t:nameTxt,fs:fs*0.78,w:500},{t:priceTxt,fs:fs*1.05,w:preset.weight}];
    else lines=[{t:nameTxt,fs:fs*0.78,w:500},{t:priceTxt,fs:fs*1.05,w:preset.weight},{t:skuTxt,fs:fs*0.62,w:500}];

    const padX=16*scaleF*l.size, padY=10*scaleF*l.size;
    let maxW=0; lines.forEach(ln=>{ ctx.font=`${ln.w} ${ln.fs}px Inter, sans-serif`; maxW=Math.max(maxW, ctx.measureText(ln.t).width); });
    const boxW=maxW+padX*2, boxH=lines.reduce((a,ln)=>a+ln.fs*1.35,0)+padY*2-(lines[0].fs*0.35);
    const bx=px-boxW/2, by=py-boxH/2;

    ctx.save();
    if(preset.shadow){ ctx.shadowColor='#00000055'; ctx.shadowBlur=14*scaleF; ctx.shadowOffsetY=6*scaleF; }
    ctx.fillStyle = preset.bg.length>7 ? preset.bg.slice(0,7) : preset.bg;
    roundRect(ctx,bx,by,boxW,boxH,preset.radius*scaleF); ctx.fill();
    if(preset.border!=='transparent'){ ctx.shadowColor='transparent'; ctx.strokeStyle=preset.border; ctx.lineWidth=1.5*scaleF; roundRect(ctx,bx,by,boxW,boxH,preset.radius*scaleF); ctx.stroke(); }
    ctx.restore();

    ctx.textBaseline='top'; ctx.textAlign='left'; ctx.fillStyle=preset.fg;
    let cy=by+padY;
    lines.forEach(ln=>{ ctx.font=`${ln.w} ${ln.fs}px Inter, sans-serif`; ctx.fillText(ln.t, bx+padX, cy); cy += ln.fs*1.35; });
  }
  for(const t of [...scene.texts].filter(x=>x.visible).sort((a,b)=>a.zIndex-b.zIndex)){
    ctx.save(); ctx.globalAlpha=t.opacity; ctx.fillStyle=t.color;
    ctx.font=`${t.weight} ${t.fontSize*scaleF}px 'Space Grotesk', sans-serif`;
    ctx.textAlign=t.align; ctx.textBaseline='middle';
    ctx.fillText(t.text, (t.x/100)*W, (t.y/100)*H);
    ctx.restore();
  }
}

/* ============================== IMAGE EXPORT ============================== */
async function doExport(){
  const project = currentProject(), scene = currentScene();
  if(!scene || !scene.image){ showToast('Envie uma imagem para a cena primeiro'); return; }
  const btn = document.getElementById('export-btn'); if(btn){ btn.style.opacity=0.6; btn.textContent='Gerando arquivo...'; }
  const fmt = FORMATS.find(f=>f.id===project.format)||FORMATS[0];
  try{
    const img = await loadImage(scene.image);
    const W=fmt.w, H=fmt.h;
    const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
    const ctx = canvas.getContext('2d');
    drawSceneToCanvas(ctx, img, W, H, scene);
    const mime = exportFileType==='jpg' ? 'image/jpeg' : 'image/png';
    const dataUrl = canvas.toDataURL(mime, 0.95);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `${project.name.replace(/\s+/g,'-').toLowerCase()}-${scene.name.replace(/\s+/g,'-').toLowerCase()}-${fmt.id.replace(':','x')}.${exportFileType}`;
    a.click();
    showToast('Imagem exportada com sucesso');
  } finally {
    if(btn){ btn.style.opacity=1; btn.innerHTML = icon('download',15)+' Baixar imagem'; }
  }
}

/* ============================== VIDEO TIMELINE (preview + real export via MediaRecorder) ============================== */
function updateVideoStatus(text){
  const el=document.getElementById('video-status'); if(el) el.textContent=text||'';
  const playBtn=document.getElementById('video-play-btn');
  if(playBtn) playBtn.innerHTML = (STATE.videoPlaying && !STATE.videoRecording) ? (icon('stop',13)+' Parar') : (icon('extlink',13)+' Reproduzir prévia');
  const exportBtn=document.getElementById('video-export-btn');
  if(exportBtn) exportBtn.disabled = STATE.videoPlaying;
}
function getMotionOffset(type, p){
  switch(type){
    case 'zoom-in': return { s: 1 + 0.22*p, ox:0, oy:0 };
    case 'zoom-out': return { s: 1.22 - 0.22*p, ox:0, oy:0 };
    case 'pan-lr': return { s: 1.16, ox: -0.075 + 0.15*p, oy:0 };
    case 'pan-rl': return { s: 1.16, ox: 0.075 - 0.15*p, oy:0 };
    case 'pan-tb': return { s: 1.16, ox:0, oy: -0.075 + 0.15*p };
    case 'pan-bt': return { s: 1.16, ox:0, oy: 0.075 - 0.15*p };
    case 'diagonal': return { s: 1.18 + 0.03*Math.sin(p*Math.PI*2), ox: 0.07*Math.sin(p*Math.PI*2), oy: 0.06*Math.cos(p*Math.PI*2) };
    case 'static': return { s:1, ox:0, oy:0 };
    default: return { s: 1 + 0.22*p, ox:0, oy:0 };
  }
}
function holdSceneWithMotion(ctx, img, W, H, scene, durMs, movement){
  return new Promise(resolve=>{
    const start = performance.now();
    function step(now){
      if(!STATE.videoPlaying){ resolve(); return; }
      const p = clamp((now-start)/durMs,0,1);
      const {s, ox, oy} = getMotionOffset(movement, p);
      ctx.clearRect(0,0,W,H);
      ctx.save();
      ctx.translate(W*ox, H*oy);
      ctx.translate(W/2,H/2); ctx.scale(s,s); ctx.translate(-W/2,-H/2);
      drawSceneToCanvas(ctx, img, W, H, scene);
      ctx.restore();
      if(p<1 && STATE.videoPlaying) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}
function animateTransition(ctx, imgA, imgB, W, H, durMs, type, sceneA, sceneB){
  return new Promise(resolve=>{
    if(durMs<=0 || type==='cut'){ ctx.clearRect(0,0,W,H); drawSceneToCanvas(ctx,imgB,W,H,sceneB); resolve(); return; }
    const start = performance.now();
    function step(now){
      if(!STATE.videoPlaying){ resolve(); return; }
      const p = clamp((now-start)/durMs,0,1);
      ctx.clearRect(0,0,W,H);
      if(type==='fade'){
        ctx.globalAlpha=1; drawSceneToCanvas(ctx,imgA,W,H,sceneA);
        ctx.globalAlpha=p; drawSceneToCanvas(ctx,imgB,W,H,sceneB); ctx.globalAlpha=1;
      } else if(type==='slide-left' || type==='slide-right'){
        const dir = type==='slide-left'? -1: 1;
        ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
        ctx.save(); ctx.translate(dir*p*W,0); drawSceneToCanvas(ctx,imgA,W,H,sceneA); ctx.restore();
        ctx.save(); ctx.translate(dir*p*W - dir*W,0); drawSceneToCanvas(ctx,imgB,W,H,sceneB); ctx.restore();
        ctx.restore();
      } else if(type==='zoom'){
        ctx.globalAlpha=1; drawSceneToCanvas(ctx,imgA,W,H,sceneA);
        ctx.globalAlpha=p;
        ctx.save(); const s=1.15-0.15*p; ctx.translate(W/2,H/2); ctx.scale(s,s); ctx.translate(-W/2,-H/2);
        drawSceneToCanvas(ctx,imgB,W,H,sceneB); ctx.restore(); ctx.globalAlpha=1;
      } else {
        drawSceneToCanvas(ctx,imgB,W,H,sceneB);
      }
      if(p<1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

async function runTimeline(project, {record}={record:false}){
  if(!project) return;
  const vc = ensureVideoConfig(project);
  const includedIds = vc.order.filter(id=>vc.settings[id].included);
  if(includedIds.length===0){ showToast('Selecione ao menos uma cena para o vídeo'); return; }
  const scenesData = includedIds.map(id=>project.scenes.find(s=>s.id===id));
  if(scenesData.some(s=>!s.image)){ showToast('Todas as cenas selecionadas precisam ter uma imagem'); return; }
  if(record && (typeof MediaRecorder==='undefined')){ showToast('Seu navegador não suporta exportação de vídeo (MediaRecorder). Tente Chrome, Edge ou Firefox.'); return; }

  const canvas = document.getElementById('video-preview-canvas');
  if(!canvas){ return; }
  if(record && !canvas.captureStream){ showToast('Seu navegador não suporta exportação de vídeo.'); return; }

  const fmt = FORMATS.find(f=>f.id===project.format)||FORMATS[0];
  const maxDim = 900;
  let W,H;
  if(fmt.w>=fmt.h){ W=Math.min(maxDim,fmt.w); H=Math.round(W*fmt.h/fmt.w); } else { H=Math.min(maxDim,fmt.h); W=Math.round(H*fmt.w/fmt.h); }
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');

  let imgs;
  try{ imgs = await Promise.all(scenesData.map(s=>loadImage(s.image))); }
  catch(e){ showToast('Erro ao carregar imagens das cenas'); return; }

  let recorder=null, chunks=[];
  if(record){
    const mimeCandidates = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    const mime = mimeCandidates.find(m=>MediaRecorder.isTypeSupported(m)) || 'video/webm';
    const stream = canvas.captureStream(30);
    recorder = new MediaRecorder(stream, {mimeType:mime});
    recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.start();
  }

  STATE.videoPlaying = true;
  STATE.videoRecording = record;
  updateVideoStatus(record ? 'Preparando gravação...' : 'Preparando prévia...');
  const exportBtn=document.getElementById('video-export-btn'); if(exportBtn) exportBtn.disabled = true;

  const speed = vc.speed || 1;
  for(let i=0;i<scenesData.length;i++){
    if(!STATE.videoPlaying) break;
    const scene = scenesData[i], img = imgs[i];
    const durMs = (vc.settings[scene.id].duration*1000)/speed;
    const transition = i<scenesData.length-1 ? vc.settings[scene.id].transition : 'none';
    const transMs = transition==='none' ? 0 : Math.min(600/speed, durMs*0.35);
    updateVideoStatus(`${record?'Gravando':'Reproduzindo'} cena ${i+1} de ${scenesData.length}...`);
    const movSetting = vc.settings[scene.id].movement || 'auto';
    const movement = movSetting==='auto' ? AUTO_MOVEMENT_CYCLE[i % AUTO_MOVEMENT_CYCLE.length] : movSetting;
    await holdSceneWithMotion(ctx, img, W, H, scene, Math.max(30, durMs-transMs), movement);
    if(!STATE.videoPlaying) break;
    if(transition!=='none' && i<scenesData.length-1){
      await animateTransition(ctx, imgs[i], imgs[i+1], W, H, transMs, transition, scenesData[i], scenesData[i+1]);
    }
  }

  const wasPlaying = STATE.videoPlaying;
  STATE.videoPlaying = false; STATE.videoRecording = false;

  if(recorder){
    updateVideoStatus('Finalizando arquivo...');
    recorder.stop();
    await new Promise(res=>{ recorder.onstop=res; });
    if(wasPlaying){
      const blob = new Blob(chunks, {type:recorder.mimeType});
      const url = URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`${project.name.replace(/\s+/g,'-').toLowerCase()}-video.webm`; a.click();
      showToast('Vídeo exportado com sucesso');
    } else {
      showToast('Gravação cancelada');
    }
  }
  updateVideoStatus(wasPlaying ? '' : 'Interrompido.');
  render();
}

render();
</script>
