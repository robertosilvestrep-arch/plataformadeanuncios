<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criador de Anúncio de Produto</title>
<style>
:root{--bg:#e6ecea;--pn:#fbfcfb;--ink:#14231f;--mut:#5d6f69;--ac:#2f4bff;--ye:#ffd23f;--bd:#c9d4d0}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:16px;width:400px;max-width:100%}
h1{font:700 20px Georgia,serif;margin:0 0 12px}
h2{font:600 14px Georgia,serif;margin:14px 0 6px}
label{display:block;color:var(--mut);margin:8px 0 2px}
input,select,button,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--ink)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:#fff;color:var(--ink);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ye);outline-offset:1px}
input[type=color]{height:38px;padding:2px}details label{margin-top:10px}
.r{display:flex;gap:8px}.r>*{flex:1}
#list div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd);gap:8px}
#list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list button{width:auto;padding:2px 8px;background:#fff;color:var(--ink);border:1px solid var(--bd)}
#cv{width:315px;height:560px;background:#000;border-radius:10px;display:block}
.pv{display:flex;flex-direction:column;gap:8px;align-items:center}
#gs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}#gs div{font-size:12px;color:var(--mut)}#gs img{border-radius:6px;margin-bottom:4px}
#st{color:var(--mut);min-height:20px;text-align:center;max-width:315px}
</style></head><body>
<div class="pn">
<h1>Criador de anúncio de produto</h1>
<h2>Material do produto</h2>
<input id="f" type="file" accept="image/*,video/*" multiple aria-label="Fotos e vídeos">
<div class="r" style="margin-top:6px"><input id="u" placeholder="Link direto (.mp4, .jpg...)"><button class="s" id="ul" style="flex:0 0 90px">Adicionar</button></div>
<div id="list"></div><label for="gd">Nome ou descrição do produto (os textos sem IA saem daqui)</label><input id="gd" placeholder="Ex.: Smartwatch Xiaomi Redmi Watch 5 Active Preto"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="au" checked style="width:auto"> Criar os textos automaticamente</label><label for="tm">Modo dos textos</label><select id="tm"><option value="auto">Automático (Gemini se tiver chave, senão modelos)</option><option value="gem">IA Gemini (vê as fotos)</option><option value="tpl">Modelos prontos (sem IA)</option><option value="loc">IA local no navegador (experimental)</option></select><label for="lm">Modelo da IA local</label><input id="lm" value="onnx-community/Qwen2.5-0.5B-Instruct"><button id="ai" style="margin-top:6px">Gerar textos (ou outra versão)</button><div id="hint" role="status" style="color:#b3261e;min-height:18px;margin-top:4px"></div>
<h2>Textos</h2>
<label for="name">Nome do produto</label><input id="name" placeholder="Nome do produto">
<div class="r"><div><label for="price">Preço</label><input id="price" placeholder="Ex.: R$ 124,90"></div><div><label for="old">Preço antigo</label><input id="old" placeholder="Ex.: R$ 229,90"></div></div>
<label for="hook">Gancho (primeira frase)</label><input id="hook" value="Pare de pagar caro em fone!">
<label for="b1">Benefícios</label><input id="b1" value="Bateria de 30 horas"><input id="b2" value="Som com graves potentes" style="margin-top:4px"><input id="b3" value="Frete rápido para todo o Brasil" style="margin-top:4px">
<label for="cta">Chamada final</label><input id="cta" value="Peça já pelo WhatsApp"><label for="wa">Contato (aparece no final)</label><input id="wa" placeholder="(00) 00000-0000"><label for="lk">Link do produto (vira QR code no final)</label><input id="lk" placeholder="https://shopee.com.br/..."><button class="s" id="cp" style="margin-top:6px">Montar legenda do post com o link</button><textarea id="cap" rows="5" placeholder="A legenda para postar aparece aqui"></textarea><label for="lg">Logo (opcional)</label><input id="lg" type="file" accept="image/*">
<h2>Estilo</h2>
<label for="fm">Formato do vídeo</label><select id="fm"><optgroup label="Vertical 9:16 (tela cheia)"><option value="igr">Instagram Reels / Stories</option><option value="fbr">Facebook Reels / Stories</option><option value="tt">TikTok</option><option value="sh">Shopee Vídeo</option><option value="ml">Mercado Livre Clips</option><option value="ys">YouTube Shorts</option><option value="wa">WhatsApp Status</option></optgroup><optgroup label="Retrato 4:5"><option value="igf">Instagram Feed</option><option value="fbf">Facebook Feed</option></optgroup><optgroup label="Quadrado 1:1"><option value="sq">Quadrado (feed, WhatsApp, anúncios)</option></optgroup><optgroup label="Horizontal 16:9"><option value="yt">YouTube / site / TV</option></optgroup></select>
<div class="r"><div><label for="theme">Modelo</label><select id="theme"><option value="oferta">Oferta relâmpago</option><option value="clean">Clean</option><option value="luxo">Premium</option></select></div><div><label for="dur">Segundos por cena</label><select id="dur"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div></div>
<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Fonte, cores e tamanhos</summary>
<label for="ff">Fonte dos textos do vídeo</label><select id="ff"><option value='Impact,"Arial Black",Arial'>Impacto (padrão)</option><option value='"Arial Black",Arial'>Arial Black</option><option value='"Segoe UI",Arial'>Segoe UI / Arial</option><option value='"Trebuchet MS",Arial'>Trebuchet</option><option value='Georgia,serif'>Georgia (serifada)</option><option value='Verdana,sans-serif'>Verdana</option><option value='"Courier New",monospace'>Courier (máquina de escrever)</option><option value='"Brush Script MT",cursive'>Manuscrita</option></select>
<label for="ts">Tamanho dos textos: <span id="tsv">100</span>%</label><input id="ts" type="range" min="60" max="140" value="100">
<label for="ps">Tamanho do preço: <span id="psv">100</span>%</label><input id="ps" type="range" min="60" max="140" value="100">
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="uc" style="width:auto"> Usar minhas cores em vez das do modelo</label>
<div class="r"><div><label for="c2">Destaque</label><input id="c2" type="color"></div><div><label for="c1">Selos</label><input id="c1" type="color"></div></div>
<div class="r"><div><label for="c4">Texto</label><input id="c4" type="color"></div><div><label for="c3">Fundo</label><input id="c3" type="color"></div></div></details>
<label for="fit">Ajuste de fotos e vídeos</label><select id="fit"><option value="card">Cartão com sombra sobre fundo liso (padrão)</option><option value="plain">Foto sem moldura sobre fundo liso</option><option value="polaroid">Moldura polaroid inclinada</option><option value="blur">Fundo desfocado da própria foto</option><option value="cover">Tela cheia (corta as bordas)</option></select><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lc" checked style="width:auto"> Mostrar legenda palavra por palavra (narração)</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bf" checked style="width:auto"> Mostrar faixa de benefícios</label><label for="mu">Música (opcional)</label><input id="mu" type="file" accept="audio/*">
</div>
<div class="pn pv" style="width:auto">
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="r" style="width:315px"><button class="s" id="pl">▶ Play</button><button class="s" id="rs" style="flex:0 0 100px">⏮ Início</button></div><div class="r" style="width:315px"><button id="rc">Gravar e baixar</button></div>
<div id="fmi" style="font-size:12px;color:var(--mut);text-align:center;max-width:330px"></div><input type="range" id="sc" min="0" max="100" value="0" style="width:315px" aria-label="Linha do tempo"><div class="r" style="width:315px"><button class="s" id="sv">Salvar projeto</button><button class="s" id="ld">Abrir projeto</button></div><input id="lf" type="file" accept=".json" hidden><div id="st" role="status">Adicione fotos ou vídeos para começar.</div>
</div>
<div class="pn"><h1>Cenas com IA</h1>
<label for="gk">Chave da API do Gemini</label><input id="gk" type="password" autocomplete="off">
<label for="gm">Modelo de imagem</label><input id="gm" value="gemini-2.5-flash-image">
<label for="gr">Fotos do produto (até 4)</label><input id="gr" type="file" accept="image/*" multiple>

<button id="gg" style="margin-top:10px">Gerar 5 cenas</button><div id="gs"></div><h2>Narração (voz Gemini)</h2><textarea id="narr" rows="4" placeholder="Roteiro falado"></textarea><div class="r" style="margin-top:6px"><button class="s" id="nb">Montar roteiro</button><button id="nt">Gerar narração</button></div><label for="lo">Sincronia da legenda: <span id="lov">120</span> ms (positivo adianta, negativo atrasa)</label><input id="lo" type="range" min="-1000" max="1500" step="50" value="120"></div>

const upd=()=>{FF=$('ff').value;TS=$('ts').value/100;PS=$('ps').value/100;LO=$('lo').value/1000;$('lov').textContent=$('lo').value;$('tsv').textContent=$('ts').value;$('psv').textContent=$('ps').value;rd()};
['ff','ts','ps','lo','uc','c1','c2','c3','c4'].forEach(i=>{$(i).addEventListener('input',upd);$(i).addEventListener('change',upd)});
$('theme').addEventListener('change',()=>{if(!$('uc').checked)syncC()});

$('gd').addEventListener('input',()=>{dirty=false;sched()});$('gd').addEventListener('keydown',e=>{if(e.key==='Enter')autoText(true)});
['lc','bf'].forEach(i=>$(i).addEventListener('change',()=>rd()));
function rd(){info();if(!playing)draw(cur)}
function pause(){if(!playing||rec)return;cancelAnimationFrame(raf);media.forEach(m=>m.k==='v'&&m.el.pause());if(audio)audio.pause();if(nsrc){try{nsrc.stop()}catch(e){}nsrc=null}playing=false;$('pl').textContent='▶ Continuar';say('Pausado. Mude o que quiser e clique em Continuar.')}
const FM={'916':[1080,1920],'45':[1080,1350],'11':[1080,1080],'169':[1920,1080]};
const PR={igr:'916',fbr:'916',tt:'916',sh:'916',ml:'916',ys:'916',wa:'916',igf:'45',fbf:'45',sq:'11',yt:'169'};
function info(){const o=$('fm').options[$('fm').selectedIndex];if(!o||!o.text)return;let m=o.text+' · '+W+'×'+H+' · '+(W>H?'horizontal':W===H?'quadrado':'vertical');if($('fm').value==='ml'){const d=media.length*cfg().D+3;if(d<12||d>60)m+=' · Atenção: os Clips do Mercado Livre pedem de 10 a 60 s (as regras citam mínimo de 12 s). Seu vídeo tem '+d+' s.'}$('fmi').textContent=m}
function setFmt(){const[w,h]=FM[PR[$('fm').value]||$('fm').value]||FM['916'];W=w;H=h;cv.width=w;cv.height=h;GS=Math.min(1,h/1500);const k=Math.min(330/w,560/h);cv.style.width=w*k+'px';cv.style.height=h*k+'px';rd()}
$('fm').addEventListener('change',()=>{if(rec&&rec.state==='recording'){$('fm').value=curFm;say('Troque o formato depois que a gravação terminar.');return}curFm=$('fm').value;setFmt()});
setFmt();
</script></body></html>
